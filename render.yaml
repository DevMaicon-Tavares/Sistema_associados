services:
  - type: web_service
    name: sistema-associados
    env: docker
    plan: starter
    region: oregon
    branch: sprint-2
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: "https://<YOUR-RENDER-SERVICE>.onrender.com"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: "<YOUR-DB-HOST>"
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: associado
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        value: "<YOUR-DB-PASSWORD>"
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local

# Observação: Render atualmente não oferece MySQL gerenciado no serviço de banco de dados.
# Use um banco MySQL externo ou ajuste o projeto para PostgreSQL/SQLite conforme necessário.
